<linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".10"/><stop offset="1" stop-color="#8b7bff" stop-opacity="0"/></linearGradient></defs>
<style>
.tr{stroke-dasharray:14 86;animation:tr 7s linear infinite;animation-delay:1.2s}
