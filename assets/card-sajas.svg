@keyframes sh{0%{transform:translateX(-200px) skewX(-20deg)}35%,100%{transform:translateX(760px) skewX(-20deg)}}
.pd{animation:pd 2.2s ease-in-out infinite}
@keyframes pd{0%,100%{opacity:.35}50%{opacity:1}}
