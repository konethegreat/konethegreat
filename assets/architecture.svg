<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-labelledby="t d">
<title id="t">ClearCut architecture</title>
<desc id="d">An agent calls the ClearCut MCP server, which uses the Rust core for money, VAT and lifecycle rules; the same core is exposed through a REST API and a TypeScript SDK. A human and policy approval step is planned.</desc>
<defs></defs>
<style>.pk{animation:pk 5.5s linear infinite}.pk2{animation-delay:1.8s}.pk3{animation-delay:3.6s}
