.dash{stroke-dasharray:5 7;animation:dash 1.4s linear infinite}@keyframes dash{to{stroke-dashoffset:-24}}
.pd{animation:pd 2.4s ease-in-out infinite}@keyframes pd{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<text x="30" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" letter-spacing="2.4" fill="#8892ab">CLEARCUT ARCHITECTURE</text>
<line class="dash" x1="30" y1="96" x2="1170" y2="96" stroke="#1b2238" stroke-width="2"/>
